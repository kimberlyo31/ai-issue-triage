[project]
name = "ai-issue-triage"
version = "0.1.0"
description = "AI-assisted classification, dedup, routing, and SLA escalation for inbound issues."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
